name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -w @mehfil/shared
      - run: npm run test:e2e -w @mehfil/api
        env: { CI: 'true' }
      - run: npm run build -w @mehfil/api
      - run: npm run build -w @mehfil/web
        env: { NEXT_TELEMETRY_DISABLED: '1' }
